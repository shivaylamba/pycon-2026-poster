run_id: lightning_a100_mixed_families
data_dir: ../data
repeats: 2
workloads:
  - chat
  - summarization
  - classification
  - rag_rank
  - batch_embeddings

costs:
  electricity_usd_per_kwh: 0.18
  hardware_usd_per_request: 0.0

default_options:
  temperature: 0.1
  top_p: 0.95
  seed: 42
  num_predict: 96
  num_ctx: 4096

providers:
  docker_model_runner_local:
    type: docker_model_runner
    base_url: http://localhost:12434/v1
    timeout_s: 1800

hardware_profiles:
  cpu:
    enabled: true
    label: CPU / num_gpu=0
    cpu_tdp_watts: 120
    provider_options:
      docker_model_runner:
        num_gpu: 0
        num_thread: 16
  gpu:
    enabled: true
    label: A100 40GB / Docker Model Runner GPU
    gpu_indices: [0]
    cpu_tdp_watts: 120
    provider_options:
      docker_model_runner:
        num_gpu: 999

generation_models:
  - name: llama3.2:3b
    label: Llama 3.2 3B
    provider: docker_model_runner_local
    family: llama3.2
    size: 3B
  - name: gemma3:4b
    label: Gemma 3 4B
    provider: docker_model_runner_local
    family: gemma3
    size: 4B
  - name: mistral-small3.2:24b
    label: Mistral Small 3.2 24B
    provider: docker_model_runner_local
    family: mistral-small3.2
    size: 24B

embedding_models:
  - name: nomic-embed-text:latest
    label: Nomic Embed Text
    provider: docker_model_runner_local
    family: nomic-embed-text
    size: 137M
  - name: mxbai-embed-large:latest
    label: mxbai Embed Large
    provider: docker_model_runner_local
    family: mxbai-embed-large
    size: 335M
  - name: bge-m3:latest
    label: BGE-M3
    provider: docker_model_runner_local
    family: bge-m3
    size: 567M

workload_options:
  batch_embeddings:
    batch_size: 4
  rag_rank:
    top_k: 3

notes:
  model_selection: "Cross-family Docker Model Runner run: Meta Llama 3.2, Google Gemma 3, Mistral Small 3.2, plus non-Qwen embedding models."
  llama4_scout_skipped: "Docker Model Runner lists llama4:scout at 67GB, which exceeds this Lightning A100 40GB GPU's VRAM for a clean full-GPU comparison."
