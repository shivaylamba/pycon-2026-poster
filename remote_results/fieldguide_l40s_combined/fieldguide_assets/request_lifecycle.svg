<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 260"><rect width="1500" height="260" fill="#ffffff"/><text x="28" y="36" fill="#10213d" font-size="24" font-weight="800">What Actually Happens During an LLM Request?</text><text x="28" y="60" fill="#6c7a89" font-size="14">A request is a pipeline: bottlenecks can come from CPU, memory movement, GPU inference, or response handling.</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1b3a5c"/></marker></defs><rect x="28" y="96" width="118" height="76" rx="8" fill="#f8f9fa" stroke="#2563eb" stroke-width="3"/><text x="87.0" y="126" text-anchor="middle" fill="#10213d" font-size="13" font-weight="800">Prompt</text><text x="87.0" y="150" text-anchor="middle" fill="#6c7a89" font-size="11">input size</text><path d="M150 134 H176" stroke="#1b3a5c" stroke-width="2.4" marker-end="url(#a)"/><rect x="178" y="96" width="118" height="76" rx="8" fill="#f8f9fa" stroke="#ca8a04" stroke-width="3"/><text x="237.0" y="126" text-anchor="middle" fill="#10213d" font-size="13" font-weight="800">CPU prefill</text><text x="237.0" y="150" text-anchor="middle" fill="#6c7a89" font-size="11">tokenize + prep</text><path d="M300 134 H326" stroke="#1b3a5c" stroke-width="2.4" marker-end="url(#a)"/><rect x="328" y="96" width="118" height="76" rx="8" fill="#f8f9fa" stroke="#0e7490" stroke-width="3"/><text x="387.0" y="126" text-anchor="middle" fill="#10213d" font-size="13" font-weight="800">RAM transfer</text><text x="387.0" y="150" text-anchor="middle" fill="#6c7a89" font-size="11">move inputs</text><path d="M450 134 H476" stroke="#1b3a5c" stroke-width="2.4" marker-end="url(#a)"/><rect x="478" y="96" width="118" height="76" rx="8" fill="#f8f9fa" stroke="#7c3aed" stroke-width="3"/><text x="537.0" y="126" text-anchor="middle" fill="#10213d" font-size="13" font-weight="800">GPU load</text><text x="537.0" y="150" text-anchor="middle" fill="#6c7a89" font-size="11">weights + VRAM</text><path d="M600 134 H626" stroke="#1b3a5c" stroke-width="2.4" marker-end="url(#a)"/><rect x="628" y="96" width="164" height="76" rx="8" fill="#f8f9fa" stroke="#16a34a" stroke-width="3"/><text x="710.0" y="126" text-anchor="middle" fill="#10213d" font-size="13" font-weight="800">Transformer</text><text x="710.0" y="150" text-anchor="middle" fill="#6c7a89" font-size="11">main inference</text><path d="M796 134 H822" stroke="#1b3a5c" stroke-width="2.4" marker-end="url(#a)"/><rect x="824" y="96" width="118" height="76" rx="8" fill="#f8f9fa" stroke="#ea580c" stroke-width="3"/><text x="883.0" y="126" text-anchor="middle" fill="#10213d" font-size="13" font-weight="800">KV cache</text><text x="883.0" y="150" text-anchor="middle" fill="#6c7a89" font-size="11">context memory</text><path d="M946 134 H972" stroke="#1b3a5c" stroke-width="2.4" marker-end="url(#a)"/><rect x="974" y="96" width="118" height="76" rx="8" fill="#f8f9fa" stroke="#be185d" stroke-width="3"/><text x="1033.0" y="126" text-anchor="middle" fill="#10213d" font-size="13" font-weight="800">Sampling</text><text x="1033.0" y="150" text-anchor="middle" fill="#6c7a89" font-size="11">next tokens</text><path d="M1096 134 H1122" stroke="#1b3a5c" stroke-width="2.4" marker-end="url(#a)"/><rect x="1124" y="96" width="118" height="76" rx="8" fill="#f8f9fa" stroke="#1d4ed8" stroke-width="3"/><text x="1183.0" y="126" text-anchor="middle" fill="#10213d" font-size="13" font-weight="800">Post-process</text><text x="1183.0" y="150" text-anchor="middle" fill="#6c7a89" font-size="11">parse + serialize</text><path d="M1246 134 H1272" stroke="#1b3a5c" stroke-width="2.4" marker-end="url(#a)"/><rect x="1274" y="96" width="118" height="76" rx="8" fill="#f8f9fa" stroke="#2563eb" stroke-width="3"/><text x="1333.0" y="126" text-anchor="middle" fill="#10213d" font-size="13" font-weight="800">Response</text><text x="1333.0" y="150" text-anchor="middle" fill="#6c7a89" font-size="11">return output</text><text x="28" y="220" fill="#1a2744" font-size="15" font-weight="800">Takeaway: inference efficiency depends on the whole system, not just the GPU.</text></svg>