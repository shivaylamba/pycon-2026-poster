<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360"><rect width="980" height="360" fill="#ffffff"/><text x="26" y="35" fill="#10213d" font-size="25" font-weight="800">What Actually Happens During One LLM Request?</text><text x="26" y="60" fill="#6c7a89" font-size="13.5">OpenTelemetry-style view: every row in the benchmark captures slices of latency, tokens, memory, and active-device energy.</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1b3a5c"/></marker></defs><line x1="32" y1="92" x2="948" y2="92" stroke="#d1d5db" stroke-width="2"/><text x="32" y="86" fill="#6c7a89" font-size="11" font-weight="800">REQUEST TRACE</text><rect x="24" y="105" width="66" height="66" rx="8" fill="#f8f9fa" stroke="#2563eb" stroke-width="2.4"/><rect x="32" y="113" width="38" height="17" rx="8" fill="#2563eb" opacity=".9"/><text x="51" y="126" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800">NET</text><text x="57.0" y="147" text-anchor="middle" fill="#10213d" font-size="12" font-weight="800">Prompt</text><text x="57.0" y="162" text-anchor="middle" fill="#6c7a89" font-size="9">request size</text><path d="M93 138 H99" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/><rect x="102" y="105" width="82" height="66" rx="8" fill="#f8f9fa" stroke="#1d4ed8" stroke-width="2.4"/><rect x="110" y="113" width="38" height="17" rx="8" fill="#1d4ed8" opacity=".9"/><text x="129" y="126" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800">CPU</text><text x="143.0" y="147" text-anchor="middle" fill="#10213d" font-size="12" font-weight="800">Python client</text><text x="143.0" y="162" text-anchor="middle" fill="#6c7a89" font-size="9">adapter + timers</text><path d="M187 138 H193" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/><rect x="196" y="105" width="86" height="66" rx="8" fill="#f8f9fa" stroke="#ca8a04" stroke-width="2.4"/><rect x="204" y="113" width="38" height="17" rx="8" fill="#ca8a04" opacity=".9"/><text x="223" y="126" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800">CPU</text><text x="239.0" y="147" text-anchor="middle" fill="#10213d" font-size="12" font-weight="800">Tokenize</text><text x="239.0" y="162" text-anchor="middle" fill="#6c7a89" font-size="9">prefill work</text><path d="M285 138 H291" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/><rect x="294" y="105" width="82" height="66" rx="8" fill="#f8f9fa" stroke="#0e7490" stroke-width="2.4"/><rect x="302" y="113" width="38" height="17" rx="8" fill="#0e7490" opacity=".9"/><text x="321" y="126" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800">RAM</text><text x="335.0" y="147" text-anchor="middle" fill="#10213d" font-size="12" font-weight="800">CPU + RAM</text><text x="335.0" y="162" text-anchor="middle" fill="#6c7a89" font-size="9">copy tensors</text><path d="M379 138 H385" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/><rect x="388" y="105" width="84" height="66" rx="8" fill="#f8f9fa" stroke="#7c3aed" stroke-width="2.4"/><rect x="396" y="113" width="38" height="17" rx="8" fill="#7c3aed" opacity=".9"/><text x="415" y="126" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800">VRAM</text><text x="430.0" y="147" text-anchor="middle" fill="#10213d" font-size="12" font-weight="800">VRAM load</text><text x="430.0" y="162" text-anchor="middle" fill="#6c7a89" font-size="9">weights/cache</text><path d="M475 138 H481" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/><rect x="484" y="105" width="104" height="66" rx="8" fill="#f8f9fa" stroke="#16a34a" stroke-width="2.4"/><rect x="492" y="113" width="38" height="17" rx="8" fill="#16a34a" opacity=".9"/><text x="511" y="126" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800">GPU</text><text x="536.0" y="147" text-anchor="middle" fill="#10213d" font-size="12" font-weight="800">Transformer</text><text x="536.0" y="162" text-anchor="middle" fill="#6c7a89" font-size="9">attention + MLP</text><path d="M591 138 H597" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/><rect x="600" y="105" width="84" height="66" rx="8" fill="#f8f9fa" stroke="#ea580c" stroke-width="2.4"/><rect x="608" y="113" width="38" height="17" rx="8" fill="#ea580c" opacity=".9"/><text x="627" y="126" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800">VRAM</text><text x="642.0" y="147" text-anchor="middle" fill="#10213d" font-size="12" font-weight="800">KV cache</text><text x="642.0" y="162" text-anchor="middle" fill="#6c7a89" font-size="9">context memory</text><path d="M687 138 H693" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/><rect x="696" y="105" width="76" height="66" rx="8" fill="#f8f9fa" stroke="#be185d" stroke-width="2.4"/><rect x="704" y="113" width="38" height="17" rx="8" fill="#be185d" opacity=".9"/><text x="723" y="126" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800">GPU</text><text x="734.0" y="147" text-anchor="middle" fill="#10213d" font-size="12" font-weight="800">Sampling</text><text x="734.0" y="162" text-anchor="middle" fill="#6c7a89" font-size="9">decode loop</text><path d="M775 138 H781" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/><rect x="784" y="105" width="84" height="66" rx="8" fill="#f8f9fa" stroke="#1d4ed8" stroke-width="2.4"/><rect x="792" y="113" width="38" height="17" rx="8" fill="#1d4ed8" opacity=".9"/><text x="811" y="126" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800">CPU</text><text x="826.0" y="147" text-anchor="middle" fill="#10213d" font-size="12" font-weight="800">Post-process</text><text x="826.0" y="162" text-anchor="middle" fill="#6c7a89" font-size="9">parse/rank</text><path d="M871 138 H877" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/><rect x="880" y="105" width="64" height="66" rx="8" fill="#f8f9fa" stroke="#2563eb" stroke-width="2.4"/><rect x="888" y="113" width="38" height="17" rx="8" fill="#2563eb" opacity=".9"/><text x="907" y="126" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800">NET</text><text x="912.0" y="147" text-anchor="middle" fill="#10213d" font-size="12" font-weight="800">Response</text><text x="912.0" y="162" text-anchor="middle" fill="#6c7a89" font-size="9">return</text><rect x="42" y="220" width="190" height="58" rx="8" fill="#fff7ed" stroke="#ca8a04" stroke-width="1.3"/><text x="54" y="242" fill="#10213d" font-size="12" font-weight="800">CPU tokenization can matter</text><text x="54" y="260" fill="#2c3e50" font-size="9.4">Prompt length and Python-side prep show up before generation.</text><rect x="278" y="220" width="190" height="58" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="1.3"/><text x="290" y="242" fill="#10213d" font-size="12" font-weight="800">Memory movement can matter</text><text x="290" y="260" fill="#2c3e50" font-size="9.4">RAM/VRAM transfers and model loading affect first-token latency.</text><rect x="520" y="220" width="190" height="58" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/><text x="532" y="242" fill="#10213d" font-size="12" font-weight="800">GPU inference dominates long outputs</text><text x="532" y="260" fill="#2c3e50" font-size="9.4">Decode loops spend repeated work on transformer blocks.</text><rect x="748" y="220" width="190" height="58" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="760" y="242" fill="#10213d" font-size="12" font-weight="800">KV cache grows</text><text x="760" y="260" fill="#2c3e50" font-size="9.4">Context length and generated tokens increase VRAM pressure.</text><rect x="26" y="305" width="928" height="34" rx="8" fill="#f0f4fa" stroke="#d1d5db"/><text x="44" y="327" fill="#1a2744" font-size="15" font-weight="800">Takeaway: efficiency is a full request pipeline, not just a GPU kernel.</text></svg>