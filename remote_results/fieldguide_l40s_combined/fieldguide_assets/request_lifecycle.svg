<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420"><rect width="980" height="420" fill="#ffffff"/><text x="28" y="38" fill="#10213d" font-size="25" font-weight="800">What Actually Happens During an LLM Request?</text><text x="28" y="65" fill="#6c7a89" font-size="14">A request is a pipeline: bottlenecks can come from CPU, memory movement, GPU inference, or response handling.</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1b3a5c"/></marker></defs><rect x="36" y="104" width="150" height="82" rx="10" fill="#f8f9fa" stroke="#2563eb" stroke-width="3"/><text x="111.0" y="137" text-anchor="middle" fill="#10213d" font-size="14" font-weight="800">Prompt</text><text x="111.0" y="162" text-anchor="middle" fill="#6c7a89" font-size="11">input size</text><circle cx="50" cy="118" r="10" fill="#2563eb" opacity=".92"/><text x="50" y="122" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">1</text><path d="M190 145 H214" stroke="#1b3a5c" stroke-width="2.4" marker-end="url(#a)"/><rect x="220" y="104" width="150" height="82" rx="10" fill="#f8f9fa" stroke="#ca8a04" stroke-width="3"/><text x="295.0" y="137" text-anchor="middle" fill="#10213d" font-size="14" font-weight="800">CPU prefill</text><text x="295.0" y="162" text-anchor="middle" fill="#6c7a89" font-size="11">tokenize + prep</text><circle cx="234" cy="118" r="10" fill="#ca8a04" opacity=".92"/><text x="234" y="122" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">2</text><path d="M374 145 H398" stroke="#1b3a5c" stroke-width="2.4" marker-end="url(#a)"/><rect x="404" y="104" width="150" height="82" rx="10" fill="#f8f9fa" stroke="#0e7490" stroke-width="3"/><text x="479.0" y="137" text-anchor="middle" fill="#10213d" font-size="14" font-weight="800">RAM transfer</text><text x="479.0" y="162" text-anchor="middle" fill="#6c7a89" font-size="11">move inputs</text><circle cx="418" cy="118" r="10" fill="#0e7490" opacity=".92"/><text x="418" y="122" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">3</text><path d="M558 145 H582" stroke="#1b3a5c" stroke-width="2.4" marker-end="url(#a)"/><rect x="588" y="104" width="150" height="82" rx="10" fill="#f8f9fa" stroke="#7c3aed" stroke-width="3"/><text x="663.0" y="137" text-anchor="middle" fill="#10213d" font-size="14" font-weight="800">GPU load</text><text x="663.0" y="162" text-anchor="middle" fill="#6c7a89" font-size="11">weights + VRAM</text><circle cx="602" cy="118" r="10" fill="#7c3aed" opacity=".92"/><text x="602" y="122" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">4</text><path d="M742 145 H766" stroke="#1b3a5c" stroke-width="2.4" marker-end="url(#a)"/><rect x="772" y="104" width="150" height="82" rx="10" fill="#f8f9fa" stroke="#16a34a" stroke-width="3"/><text x="847.0" y="137" text-anchor="middle" fill="#10213d" font-size="14" font-weight="800">Transformer</text><text x="847.0" y="162" text-anchor="middle" fill="#6c7a89" font-size="11">main inference</text><circle cx="786" cy="118" r="10" fill="#16a34a" opacity=".92"/><text x="786" y="122" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">5</text><path d="M847 190 C847 235, 128 220, 128 260" fill="none" stroke="#1b3a5c" stroke-width="2.4" marker-end="url(#a)" stroke-dasharray="5 4"/><rect x="128" y="262" width="150" height="82" rx="10" fill="#f8f9fa" stroke="#ea580c" stroke-width="3"/><text x="203.0" y="295" text-anchor="middle" fill="#10213d" font-size="14" font-weight="800">KV cache</text><text x="203.0" y="320" text-anchor="middle" fill="#6c7a89" font-size="11">context memory</text><circle cx="142" cy="276" r="10" fill="#ea580c" opacity=".92"/><text x="142" y="280" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">6</text><path d="M282 303 H306" stroke="#1b3a5c" stroke-width="2.4" marker-end="url(#a)"/><rect x="336" y="262" width="150" height="82" rx="10" fill="#f8f9fa" stroke="#be185d" stroke-width="3"/><text x="411.0" y="295" text-anchor="middle" fill="#10213d" font-size="14" font-weight="800">Sampling</text><text x="411.0" y="320" text-anchor="middle" fill="#6c7a89" font-size="11">next tokens</text><circle cx="350" cy="276" r="10" fill="#be185d" opacity=".92"/><text x="350" y="280" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">7</text><path d="M490 303 H514" stroke="#1b3a5c" stroke-width="2.4" marker-end="url(#a)"/><rect x="544" y="262" width="150" height="82" rx="10" fill="#f8f9fa" stroke="#1d4ed8" stroke-width="3"/><text x="619.0" y="295" text-anchor="middle" fill="#10213d" font-size="14" font-weight="800">Post-process</text><text x="619.0" y="320" text-anchor="middle" fill="#6c7a89" font-size="11">parse + serialize</text><circle cx="558" cy="276" r="10" fill="#1d4ed8" opacity=".92"/><text x="558" y="280" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">8</text><path d="M698 303 H722" stroke="#1b3a5c" stroke-width="2.4" marker-end="url(#a)"/><rect x="752" y="262" width="150" height="82" rx="10" fill="#f8f9fa" stroke="#2563eb" stroke-width="3"/><text x="827.0" y="295" text-anchor="middle" fill="#10213d" font-size="14" font-weight="800">Response</text><text x="827.0" y="320" text-anchor="middle" fill="#6c7a89" font-size="11">return output</text><circle cx="766" cy="276" r="10" fill="#2563eb" opacity=".92"/><text x="766" y="280" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">9</text><text x="28" y="392" fill="#1a2744" font-size="15" font-weight="800">Takeaway: inference efficiency depends on the whole system, not just the GPU.</text></svg>