<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300">
<rect width="900" height="300" fill="#ffffff"/>
<text x="30" y="42" fill="#10213d" font-size="25" font-weight="900">Memory Movement View</text>
<text x="30" y="70" fill="#8aa0bd" font-size="14">Quantization reduces weight traffic; long prompts expand KV cache; batching changes the economics.</text>
<rect x="42" y="115" width="170" height="90" rx="12" fill="#0d1b2f" stroke="#ca8a04" stroke-width="3"/><text x="127" y="150" text-anchor="middle" fill="#10213d" font-size="17" font-weight="800">CPU RAM</text><text x="127" y="176" text-anchor="middle" fill="#8aa0bd" font-size="13">tokens + prompts</text>
<rect x="365" y="92" width="190" height="136" rx="12" fill="#0d1b2f" stroke="#1b3a5c" stroke-width="3"/><text x="460" y="138" text-anchor="middle" fill="#10213d" font-size="18" font-weight="800">GPU VRAM</text><text x="460" y="166" text-anchor="middle" fill="#8aa0bd" font-size="13">weights + KV cache</text><text x="460" y="194" text-anchor="middle" fill="#15803d" font-size="13" font-weight="800">q4 &lt; q8 &lt; fp16</text>
<rect x="690" y="115" width="170" height="90" rx="12" fill="#0d1b2f" stroke="#15803d" stroke-width="3"/><text x="775" y="150" text-anchor="middle" fill="#10213d" font-size="17" font-weight="800">Tensor Cores</text><text x="775" y="176" text-anchor="middle" fill="#8aa0bd" font-size="13">attention + MLP</text>
<path d="M218 160 H356" stroke="#1d4ed8" stroke-width="8" opacity=".8"/><path d="M558 160 H682" stroke="#15803d" stroke-width="8" opacity=".8"/>
<text x="286" y="143" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="800">prefill traffic</text>
<text x="620" y="143" text-anchor="middle" fill="#15803d" font-size="13" font-weight="800">decode loop</text>
<text x="365" y="260" fill="#be185d" font-size="24" font-weight="900">KV cache grows with context length</text>
</svg>