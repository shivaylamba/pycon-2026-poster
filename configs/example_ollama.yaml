run_id: pycon_ollama_vm
data_dir: ../data
repeats: 3
workloads:
  - chat
  - summarization
  - classification
  - rag_rank
  - batch_embeddings

costs:
  electricity_usd_per_kwh: 0.18
  hardware_usd_per_request: 0.0

default_options:
  temperature: 0.1
  top_p: 0.95
  seed: 42
  num_predict: 192

providers:
  ollama_local:
    type: ollama
    base_url: http://localhost:11434
    timeout_s: 900

hardware_profiles:
  cpu:
    enabled: true
    label: CPU / num_gpu=0
    cpu_tdp_watts:
    provider_options:
      ollama:
        num_gpu: 0
        num_thread: 8
  gpu:
    enabled: true
    label: GPU / Ollama auto
    gpu_indices: [0]
    cpu_tdp_watts:
    provider_options:
      ollama: {}

generation_models:
  - name: llama3.2:1b
    label: Llama 3.2 1B
    provider: ollama_local
    family: llama
    size: 1B
  - name: qwen2.5:3b
    label: Qwen 2.5 3B
    provider: ollama_local
    family: qwen
    size: 3B
  - name: mistral:7b-instruct-v0.3
    label: Mistral 7B
    provider: ollama_local
    family: mistral
    size: 7B

embedding_models:
  - name: nomic-embed-text
    label: Nomic Embed Text
    provider: ollama_local
    family: nomic
    size: small
  - name: mxbai-embed-large
    label: MXBAI Embed Large
    provider: ollama_local
    family: mxbai
    size: large

workload_options:
  batch_embeddings:
    batch_size: 8
  rag_rank:
    top_k: 3
